<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED YouTube Sync Mobile</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            gap: 15px;
        }
        h2 { margin: 5px 0; font-size: 20px; text-align: center; }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 400px; }
        button, select, input[type="text"] {
            padding: 12px 15px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }
        button { background: #2563eb; color: white; cursor: pointer; flex: 1; min-width: 110px; }
        button:hover:not(:disabled) { background: #1d4ed8; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-test { background: #10b981; }
        .btn-test:hover:not(:disabled) { background: #059669; }
        .btn-disconnect { background: #ef4444; }
        .btn-disconnect:hover:not(:disabled) { background: #dc2626; }
        select { background: #333; color: white; border: 1px solid #555; }
        
        /* Vinilo animado */
        #visualizer {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #333 30%, #111 31%, #111 70%, #000 71%);
            border: 5px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.05s ease;
            margin: 5px 0;
        }
        .vinyl-center { width: 35px; height: 35px; background: #e11d48; border-radius: 50%; border: 2px solid #fff; }

        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1e1e1e;
            padding: 12px 15px;
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
            gap: 8px;
        }
        input[type="range"] { width: 100%; }
        
        /* Buscador de YouTube */
        .youtube-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 350px;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
        }
        .youtube-box input {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            flex: 2;
        }
        .search-row { display: flex; gap: 8px; }
        .search-row button { background: #dc2626; min-width: auto; flex: 1; }
        
        #player-container { width: 100%; height: 160px; border-radius: 6px; overflow: hidden; background: #000; display: none; }
        
        #log {
            font-family: monospace;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
            height: 80px;
            overflow-y: auto;
            font-size: 11px;
            color: #10b981;
        }
    </style>
</head>
<body>

    <h2>Control LED Rítmico</h2>
    
    <div id="visualizer">
        <div class="vinyl-center"></div>
    </div>

    <div class="controls">
        <button id="btnBluetooth">🔗 Conectar Luz</button>
        <button id="btnDisconnect" class="btn-disconnect" disabled>❌ Desconectar</button>
        <button id="btnMic" style="background: #8b5cf6;">🎙️ Activar Ritmo</button>
        <button id="btnTest" class="btn-test" disabled>🧪 Probar Color</button>
    </div>

    <div class="controls">
        <label>Protocolo: 
            <select id="protocolSelect">
                <option value="elk">ELK-BLEDOM (9 bytes)</option>
                <option value="triones">Triones / HappyLighting (7 bytes)</option>
            </select>
        </label>
    </div>

    <!-- Buscador y Reproductor de YouTube Integrado -->
    <div class="youtube-box">
        <label style="font-size: 13px; font-weight: bold;">🎵 Reproductor de YouTube:</label>
        <div class="search-row">
            <input type="text" id="ytUrl" placeholder="Pega el Link de YouTube aquí...">
            <button id="loadVideo">Cargar</button>
        </div>
        <div id="player-container">
            <div id="youtube-player"></div>
        </div>
    </div>

    <div class="panel">
        <label style="font-size: 12px;">Sensibilidad al ritmo: <span id="sensVal">45</span></label>
        <input type="range" id="sensitivity" min="20" max="200" value="45">
        <small style="color: #aaa; font-size: 11px;">Graves: <span id="bassLevel">0</span></small>
    </div>

    <div id="log">Conecta tus luces para empezar...<br></div>

    <!-- API de YouTube IFrame -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
</body>
</html>
